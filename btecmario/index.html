<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BTEC MARIO</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3CradialGradient id='g' cx='.5' cy='.5' r='.5' fx='.35' fy='.3'%3E%3Cstop offset='0' stop-color='%23ecd6ff'/%3E%3Cstop offset='.18' stop-color='%23b26ee8'/%3E%3Cstop offset='.65' stop-color='%236a249e'/%3E%3Cstop offset='1' stop-color='%232c0a4d'/%3E%3C/radialGradient%3E%3Ccircle cx='32' cy='32' r='30' fill='url(%23g)'/%3E%3Cellipse cx='22' cy='19' rx='10' ry='6.5' fill='%23fff' fill-opacity='.6' transform='rotate(-35 22 19)'/%3E%3C/svg%3E">
<style>
  @font-face { font-family: "CM Serif"; font-style: normal; font-weight: 400; font-display: swap;
    src: local("CMU Serif Roman"), local("CMUSerif-Roman"), local("LM Roman 10 Regular"), local("LMRoman10-Regular"),
         url("https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/fonts/KaTeX_Main-Regular.woff2") format("woff2"); }
  :root { color-scheme: light; --ink: #1a1a1a; --line-2: #d5d5d5; --accent: #1f5bc4; --bad: #b42318; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; color: var(--ink); }
  body { font-family: "CM Serif", "CMU Serif", "Latin Modern Roman", Georgia, "Times New Roman", serif;
         -webkit-font-smoothing: antialiased; }
  .lock { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; }
  .lock[hidden] { display: none; }
  form { display: flex; gap: 8px; width: 100%; max-width: 320px; }
  #pw { flex: 1; min-width: 0; font: inherit; font-size: 17px; padding: 10px 12px; color: var(--ink); background: #fff;
        border: 1px solid var(--line-2); border-radius: 8px; }
  #pw:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  #pw.bad { border-color: var(--bad); outline-color: var(--bad); animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  button { font: inherit; font-size: 17px; padding: 10px 18px; color: #fff; background: var(--accent);
           border: 0; border-radius: 8px; cursor: pointer; }
  button:hover { background: #1a4fae; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .7; cursor: progress; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { #pw.bad { animation: none; } }
</style>
</head>
<body>
<main class="lock" id="lock" hidden>
  <form id="unlock">
    <input id="pw" type="password" autocomplete="current-password" aria-label="Password" required>
    <button id="go" type="submit">Enter</button>
  </form>
  <p class="sr" id="msg" role="alert"></p>
</main>
<noscript><p style="margin-top: 40vh; text-align: center;">This page needs JavaScript to unlock.</p></noscript>
<script>
// The page itself is encrypted below (AES-256-GCM, key = PBKDF2-SHA256 of the password).
// After unlocking, the key (not the password) is kept in this browser so other pages open directly.
(() => {
  "use strict";
  const C = { salt: "M8oae8IvI4NMhlz2IvRtIQ==", iv: "eLUbOp7QGWM/J/xi", iter: 600000, data: "otdeBBa7nroP/rxBtDyT6Yh19rTM/1OLgACTyb9xTym2YacGsRb9ATuBSgAOqwMdAEDGxTZVHs9QeWZhq7dCGu4fLnqM7gn0mQ+tfwSBQpOSOK425SCwP9NzHdSQimwjseltd2fMcUCLRGEhO1ZJp9Q7dHGvR/7In9r7y5s44uYaeCTJX3LLnHFoi6eueCs2OnECOrnZ9KTuLTMQCv6dC2UCibkMcyC0ZZ0MzQEIc/e7uAEpomOpBMi69HOW4zWaNvb0q1HKiKWhi7XSk4eZ6JIDrOvhLVCHFRgrwMzKFGg2TVtqxytDETiGVRFH2BgMi/NEwbA9IaImmcsgtsGLUM0bGqJdI+96WKrqY5VPgdfHdFh9Bj2qqu4lrLEdafrU9xZy1VOc1zs+h/yT4YqE+uTPaGPK47EQqZjf2U5JGhhwo5aaVtGnx/cB6kh8W6PIRxBGme5VnQ1PpJ8iIeHjB2BjZWFeqBwkW2NoJdeZpqAXX66y3mgOHFNT8L0j7AqZHHlVc/AOtbsjJ3/fikefUv/FbT/VXvsCrJXLArTq7qtr/26spU8pAD+Ri/B9Z77oS/iaN4RZSFks5yNCxXtf4MW5J9yrbD+1CCrFH0VFQgqqOsWEj2fmwAqrTiAGZO2DbdybXCg=" };
  const NAME = "site-unlock-key";
  const $ = id => document.getElementById(id);
  const bytes = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));
  const toB64 = buf => btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));
  const stores = () => {
    const out = [];
    try { out.push(sessionStorage); } catch (e) {}
    try { out.push(localStorage); } catch (e) {}
    return out;
  };

  // Replace this lock page with the decrypted one. document.open() only replaces the page once this
  // document has finished loading; called earlier, the browser appends the new page to this one instead.
  const loaded = () => document.readyState === "complete" ? Promise.resolve()
    : new Promise(resolve => window.addEventListener("load", resolve, { once: true }));
  // Chrome does not fire "load" again for the written page, and libraries such as p5.js wait for it,
  // so fire it once the written page is complete if the browser has not.
  async function show(html) {
    await loaded();
    document.open();
    let fired = false;
    window.addEventListener("load", () => { fired = true; }, { once: true });
    document.addEventListener("readystatechange", () => {
      if (document.readyState === "complete")
        setTimeout(() => { if (!fired) window.dispatchEvent(new Event("load")); }, 0);
    });
    document.write(html);
    document.close();
  }
  async function decrypt(key) {
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(C.iv) }, key, bytes(C.data));
    return new TextDecoder().decode(plain);
  }
  function savedKey() {
    for (const s of stores()) {
      try { const v = s.getItem(NAME); if (v && v.startsWith(C.salt + ":")) return v.slice(C.salt.length + 1); } catch (e) {}
    }
    return null;
  }
  function forget() { for (const s of stores()) { try { s.removeItem(NAME); } catch (e) {} } }
  function save(raw) {
    forget();
    try { localStorage.setItem(NAME, C.salt + ":" + raw); } catch (e) {}
  }
  function showForm() {
    $("lock").hidden = false;
    $("pw").focus();
  }

  $("pw").addEventListener("input", () => { $("pw").classList.remove("bad"); $("pw").removeAttribute("aria-invalid"); });
  $("unlock").addEventListener("submit", async ev => {
    ev.preventDefault();
    const go = $("go"), pw = $("pw");
    go.disabled = true; $("msg").textContent = "";
    let html = null, raw = null;
    try {
      const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw.value), "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: bytes(C.salt), iterations: C.iter, hash: "SHA-256" },
        base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
      html = await decrypt(key);
      raw = toB64(await crypto.subtle.exportKey("raw", key));
    } catch (e) { html = null; }
    if (html === null) {             // wrong password: red box and a short shake, no visible text
      pw.classList.remove("bad"); void pw.offsetWidth; pw.classList.add("bad");
      pw.setAttribute("aria-invalid", "true");
      $("msg").textContent = "Wrong password";
      go.disabled = false; pw.select();
      return;
    }
    save(raw);
    await show(html);
  });

  if (!(window.crypto && crypto.subtle)) { showForm(); $("go").disabled = true; return; }
  (async () => {
    const raw = savedKey();
    if (raw) {
      try {
        const key = await crypto.subtle.importKey("raw", bytes(raw), "AES-GCM", false, ["decrypt"]);
        await show(await decrypt(key));
        return;
      } catch (e) { forget(); }
    }
    showForm();
  })();
})();
</script>
</body>
</html>
