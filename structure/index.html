<style>
  /* Computer Modern, as in the LaTeX-rendered figure labels: use a local CMU / Latin Modern
     install if present, otherwise the KaTeX build of CM; offline it falls back to Georgia. */
  @font-face { font-family: "CM Serif"; font-style: normal; font-weight: 400; font-display: swap;
    src: local("CMU Serif Roman"), local("CMUSerif-Roman"), local("LM Roman 10 Regular"), local("LMRoman10-Regular"),
         url("https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/fonts/KaTeX_Main-Regular.woff2") format("woff2"); }
  @font-face { font-family: "CM Serif"; font-style: italic; font-weight: 400; font-display: swap;
    src: local("CMU Serif Italic"), local("CMUSerif-Italic"), local("LM Roman 10 Italic"), local("LMRoman10-Italic"),
         url("https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/fonts/KaTeX_Main-Italic.woff2") format("woff2"); }
  @font-face { font-family: "CM Serif"; font-style: normal; font-weight: 700; font-display: swap;
    src: local("CMU Serif Bold"), local("CMUSerif-Bold"), local("LM Roman 10 Bold"), local("LMRoman10-Bold"),
         url("https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/fonts/KaTeX_Main-Bold.woff2") format("woff2"); }

  :root {
    --ink: #1a1a1a;
    --ink-2: #444;
    --muted: #767676;
    --faint: #a5a5a5;
    --line: #e7e7e7;
    --line-2: #d5d5d5;
    --wash: #f6f7f9;
    --accent: #1f5bc4;
    --accent-wash: #eaf1fb;
    --serif: "CM Serif", "CMU Serif", "Latin Modern Roman", Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #fff; color: var(--ink); font-family: var(--serif); }
  body { -webkit-font-smoothing: antialiased; }
  sub { font-size: .72em; line-height: 0; }
  .ov { text-decoration: overline; text-decoration-thickness: .06em; }

  .app { display: grid; grid-template-columns: minmax(0, 1fr) 300px; height: 100vh; height: 100dvh; }

  /* ---- 3D stage ---- */
  .stage { position: relative; overflow: hidden; min-height: 0; background: #fff; }
  #view { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; outline: none; }
  #view.dragging { cursor: grabbing; }
  #view.panning { cursor: move; }
  .hint { position: absolute; right: 18px; bottom: 14px; font-size: 13.5px; color: var(--faint);
          pointer-events: none; user-select: none; text-align: right; }
  .tip { position: absolute; left: 0; top: 0; pointer-events: none; opacity: 0; transition: opacity .12s;
         background: rgba(255,255,255,.97); border: 1px solid var(--line); border-radius: 9px;
         box-shadow: 0 8px 24px rgba(30,30,60,.09); padding: 9px 12px 10px; font-size: 14px; line-height: 1.5;
         white-space: nowrap; z-index: 2; }
  .tip.on { opacity: 1; }
  .tip-h { display: flex; align-items: center; gap: 7px; font-size: 16px; margin-bottom: 2px; }
  .tip-h span { color: var(--muted); font-size: 14px; }
  .tip-f { color: var(--ink-2); }
  .tip-n { color: var(--muted); font-size: 13.5px; }

  /* ---- control panel ---- */
  .panel { border-left: 1px solid var(--line); overflow-y: auto; padding: 24px 22px 20px;
           display: flex; flex-direction: column; gap: 19px; background: #fff; }
  .home { display: inline-block; margin: 0 0 12px; font-size: 11.5px; letter-spacing: .15em; text-transform: uppercase;
          color: var(--muted); text-decoration: none; }
  .home:hover, .home:focus-visible { color: var(--accent); }
  .title h1 { font-weight: 400; font-size: 31px; line-height: 1.05; margin: 0; }
  .title p { margin: 7px 0 0; color: var(--muted); font-size: 15px; line-height: 1.35; }
  section h2 { margin: 0 0 9px; font-size: 11.5px; font-weight: 400; letter-spacing: .15em;
               text-transform: uppercase; color: var(--muted); }
  .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; }
  .head h2 { margin: 0; }

  .chips { display: flex; flex-wrap: wrap; gap: 7px; transition: opacity .15s; }
  .chips.atoms { display: grid; grid-template-columns: repeat(3, 1fr); }
  .chips.off { opacity: .4; pointer-events: none; }
  .chip { appearance: none; -webkit-appearance: none; font: inherit; color: var(--ink); background: #fff;
          border: 1px solid var(--line-2); border-radius: 999px; display: inline-flex; align-items: center;
          justify-content: center; gap: 7px; padding: 6px 12px 6px 7px; font-size: 16.5px; line-height: 1;
          cursor: pointer; transition: border-color .15s, background-color .15s, color .15s; }
  .chip.bond { font-size: 14.5px; padding: 6px 11px 6px 8px; gap: 6px; }
  .chip:hover { border-color: #b3b3b3; }
  .chip svg { flex: none; transition: opacity .15s, filter .15s; }
  .chip[aria-pressed="false"] { color: var(--faint); background: var(--wash); border-color: var(--line); }
  .chip[aria-pressed="false"] svg { opacity: .3; filter: grayscale(1); }

  .opt { display: flex; align-items: center; justify-content: space-between; gap: 12px;
         padding: 6px 0; font-size: 15.5px; cursor: pointer; }
  .switch { appearance: none; -webkit-appearance: none; margin: 0; flex: none; width: 34px; height: 20px;
            border-radius: 999px; background: #d3d3d3; position: relative; cursor: pointer; transition: background .18s; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
                   background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .18s; }
  .switch:checked { background: var(--accent); }
  .switch:checked::after { transform: translateX(14px); }

  .range { display: grid; grid-template-columns: auto 1fr 3.4em; align-items: center; gap: 12px;
           padding: 7px 0 2px; font-size: 15.5px; }
  .range output { font-size: 13.5px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; margin: 0; background: transparent; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 3px; background: var(--line-2); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6.5px; border-radius: 50%;
                                            background: #fff; border: 1.5px solid var(--accent); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  input[type=range]::-moz-range-track { height: 3px; border-radius: 3px; background: var(--line-2); }
  input[type=range]::-moz-range-thumb { width: 13px; height: 13px; border-radius: 50%; background: #fff; border: 1.5px solid var(--accent); }

  .cellrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0; font-size: 15.5px; }
  .stepper { display: inline-flex; align-items: center; border: 1px solid var(--line-2); border-radius: 999px; overflow: hidden; flex: none; }
  .stepper button { appearance: none; border: 0; background: #fff; font: inherit; font-size: 18px; line-height: 1; color: var(--ink-2);
                    width: 30px; height: 28px; cursor: pointer; }
  .stepper button:hover:not(:disabled) { background: var(--wash); }
  .stepper button:disabled { color: #d0d0d0; cursor: default; }
  .stepper output { min-width: 24px; text-align: center; font-size: 15.5px; font-variant-numeric: tabular-nums; }

  .btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .btns.two { grid-template-columns: repeat(2, 1fr); }
  .btn { appearance: none; font: inherit; font-size: 14.5px; color: var(--ink); background: #fff; border: 1px solid var(--line-2);
         border-radius: 8px; padding: 7px 0 6px; cursor: pointer; transition: border-color .15s, background-color .15s, color .15s; }
  .btn:hover { border-color: #b3b3b3; background: var(--wash); }
  .btn.active { border-color: #9db6e2; background: var(--accent-wash); color: #17428f; }
  .readout { margin-top: 8px; font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .chip:focus-visible, .btn:focus-visible, .stepper button:focus-visible, .switch:focus-visible, input[type=range]:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; }

  .meta { margin-top: auto; border-top: 1px solid var(--line); padding-top: 13px; font-size: 13px; line-height: 1.5; color: var(--muted); }
  .meta p { margin: 0 0 6px; }
  .meta p:last-child { margin: 0; }

  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 64vh auto; height: auto; }
    .panel { border-left: 0; border-top: 1px solid var(--line); padding: 20px 16px 24px; overflow: visible; }
    .hint { display: none; }
  }
</style>

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs id="uiDefs"></defs></svg>

<div class="app">
  <main class="stage" id="stage">
    <canvas id="view" tabindex="0" aria-label="Interactive 3D crystal structure of PdCrO2. Drag to rotate, scroll to zoom, arrow keys to rotate."></canvas>
    <div class="tip" id="tip" role="status" aria-live="polite"></div>
    <div class="hint">Drag to rotate · Shift-drag to pan · Scroll to zoom · Double-click to reset</div>
  </main>

  <aside class="panel" aria-label="Display controls">
    <header class="title">
      <a class="home" href="https://reueldsouza2000.github.io/">← Home</a>
      <h1>PdCrO<sub>2</sub></h1>
      <p>Delafossite, <i>R</i><span class="ov">3</span><i>m</i> — non-magnetic state</p>
    </header>

    <section>
      <h2>Atoms</h2>
      <div class="chips atoms">
        <button class="chip" type="button" data-el="Pd" aria-pressed="true" title="Show / hide palladium">Pd</button>
        <button class="chip" type="button" data-el="Cr" aria-pressed="true" title="Show / hide chromium">Cr</button>
        <button class="chip" type="button" data-el="O"  aria-pressed="true" title="Show / hide oxygen">O</button>
      </div>
    </section>

    <section>
      <div class="head"><h2>Bonds</h2><input type="checkbox" class="switch" id="bonds" checked aria-label="Show bonds"></div>
      <div class="chips" id="bondChips">
        <button class="chip bond" type="button" data-bond="Pd-O"  aria-pressed="true">Pd–O</button>
        <button class="chip bond" type="button" data-bond="Cr-O"  aria-pressed="true">Cr–O</button>
        <button class="chip bond" type="button" data-bond="Pd-Pd" aria-pressed="false" title="In-plane Pd–Pd (metallic Pd sheet)">Pd–Pd</button>
      </div>
    </section>

    <section>
      <h2>Display</h2>
      <label class="opt"><span>CrO<sub>6</sub> octahedra</span><input type="checkbox" class="switch" id="octa" checked></label>
      <label class="opt"><span>Unit cell</span><input type="checkbox" class="switch" id="cell" checked></label>
      <label class="opt"><span>Depth cue</span><input type="checkbox" class="switch" id="fog" checked></label>
      <label class="range"><span>Atom size</span><input type="range" id="size" min="0.5" max="2" step="0.05" value="1"><output id="sizeOut">1.00×</output></label>
    </section>

    <section>
      <h2>Supercell</h2>
      <div class="cellrow"><span>In-plane, <i>a</i> × <i>b</i></span>
        <div class="stepper" data-key="n" data-min="1" data-max="6">
          <button type="button" data-d="-1" aria-label="Fewer in-plane cells">−</button><output>3</output><button type="button" data-d="1" aria-label="More in-plane cells">+</button>
        </div>
      </div>
      <div class="cellrow" title="One layer = one Pd sheet + one CrO2 sheet (c/3). Three layers make one unit cell.">
        <span>Layers along <i>c</i></span>
        <div class="stepper" data-key="k" data-min="1" data-max="6">
          <button type="button" data-d="-1" aria-label="Fewer layers">−</button><output>3</output><button type="button" data-d="1" aria-label="More layers">+</button>
        </div>
      </div>
    </section>

    <section>
      <h2>View along</h2>
      <div class="btns">
        <button class="btn" type="button" data-view="001" title="Top view, down the c axis">[001]</button>
        <button class="btn" type="button" data-view="100" title="Side view along a">[100]</button>
        <button class="btn" type="button" data-view="120" title="Side view perpendicular to a">[120]</button>
        <button class="btn" type="button" data-view="reset" title="Default view (double-click the structure)">Reset</button>
      </div>
      <div class="readout" id="readout"></div>
    </section>

    <section>
      <h2>Export current view</h2>
      <div class="btns two">
        <button class="btn" type="button" id="exSvg" title="Vector file in the style of your figures">SVG</button>
        <button class="btn" type="button" id="exPng" title="3× resolution bitmap">PNG</button>
      </div>
    </section>

    <footer class="meta" id="meta"></footer>
  </aside>
</div>

<script>
(() => {
  'use strict';

  /* ==================================================================
     Crystal structure: PdCrO2, delafossite, R-3m (No. 166), hexagonal setting.
     Takatsu et al., Phys. Rev. B 89, 104408 (2014), Table I — X-ray, 300 K
     (paramagnetic, T > T_N = 37.5 K).
     ================================================================== */
  const LAT = { a: 2.9228, c: 18.093, z: 0.1105 };
  const SQ3 = Math.sqrt(3), D2R = Math.PI / 180;
  const CENTRING = [[0, 0, 0], [2 / 3, 1 / 3, 1 / 3], [1 / 3, 2 / 3, 2 / 3]];
  const BASIS = [
    { el: 'Pd', site: '3a', f: [0, 0, 0] },
    { el: 'Cr', site: '3b', f: [0, 0, 0.5] },
    { el: 'O',  site: '6c', f: [0, 0,  LAT.z] },
    { el: 'O',  site: '6c', f: [0, 0, -LAT.z] },
  ];

  function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
  function add(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
  function scl(a, s) { return [a[0] * s, a[1] * s, a[2] * s]; }
  function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
  function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
  function len(a) { return Math.hypot(a[0], a[1], a[2]); }
  function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
  function cart(f) { return [LAT.a * (f[0] - 0.5 * f[1]), LAT.a * (SQ3 / 2) * f[1], LAT.c * f[2]]; }
  function hexRGB(h) { return [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); }
  function toWhite(rgb, f) { return rgb.map(v => Math.round(v + (255 - v) * f)); }
  function css(rgb, a) { return a === undefined || a >= 1 ? `rgb(${rgb})` : `rgba(${rgb},${+a.toFixed(3)})`; }
  function hex(rgb) { return '#' + rgb.map(v => v.toString(16).padStart(2, '0')).join(''); }

  const DIST = {
    PdO: LAT.z * LAT.c,
    CrO: Math.hypot(LAT.a / SQ3, (1 / 6 - LAT.z) * LAT.c),
    MM: LAT.a,
  };
  const ANG = (() => {           // cis O–Cr–O angles (trigonally distorted octahedron)
    const h = -(1 / 6 - LAT.z) * LAT.c, q = LAT.a / SQ3;
    const A = [q, 0, h], B = [q * Math.cos(2 * Math.PI / 3), q * Math.sin(2 * Math.PI / 3), h];
    const intra = Math.acos(dot(A, B) / (len(A) * len(B))) / D2R;
    return { intra, inter: 180 - intra };
  })();

  /* ==================================================================
     Style — sphere shading copied from the reference figures
     (radial body gradient, rim light, gloss + spark ellipses at −35°).
     ================================================================== */
  const EL = {
    Pd: { name: 'palladium', r: 0.50, stops: ['#ffffff', '#dfe2e7', '#8b929b', '#2d3238'], rim: '#eef2f6' },
    Cr: { name: 'chromium',  r: 0.44, stops: ['#ecd6ff', '#b26ee8', '#6a249e', '#2c0a4d'], rim: '#e2b8ff' },
    O:  { name: 'oxygen',    r: 0.32, stops: ['#ffe1dc', '#ee5747', '#a8161b', '#450507'], rim: '#ffb3a9' },
  };
  const STOP_AT = [0, 0.18, 0.65, 1];
  const GLOSS = [[0, 1], [0.35, 0.85], [0.75, 0.25], [1, 0]];
  const SPARK = [[0, 1], [0.6, 0.9], [1, 0]];
  const BOND_R = 0.085;                                   // Å
  const BOND_STOPS = [[0, '#a5a5a5'], [0.28, '#f3f3f3'], [0.62, '#bcbcbc'], [1, '#6b6b6b']].map(([o, c]) => [o, hexRGB(c)]);
  const OCTA_FILL = hexRGB('#b26ee8'), OCTA_EDGE = hexRGB('#6a249e'), OCTA_FA = 0.2, OCTA_EA = 0.42;
  const CELL_RGB = hexRGB('#3a3a3a');
  const FOG_MAX = 0.38, FOG_LEVELS = 16;
  const LIGHT = [-0.6, -0.8];                             // screen-space light direction (upper left)
  const SERIF = '"CM Serif", "CMU Serif", "Latin Modern Roman", Georgia, "Times New Roman", serif';
  const VIEWS = {
    reset: { phi: 20 * D2R, theta: 16 * D2R },
    '001': { phi: 0, theta: 90 * D2R },
    '100': { phi: 90 * D2R, theta: 0 },
    '120': { phi: 0, theta: 0 },
  };

  const S = {
    show: { Pd: true, Cr: true, O: true },
    bonds: true, bondType: { 'Pd-O': true, 'Cr-O': true, 'Pd-Pd': false },
    octa: true, cell: true, fog: true, size: 1,
    n: 3, k: 3,
    phi: VIEWS.reset.phi, theta: VIEWS.reset.theta,
    scale: 30, panX: 0, panY: 0,
  };

  /* ==================================================================
     Model: Pd and Cr inside the n × n × (k/3) box; O wherever it belongs
     to the CrO6 octahedron of one of those Cr (so every octahedron is
     complete and no O–Pd dumbbell dangles off a corner); bonds by distance.
     ================================================================== */
  function buildModel(n, k) {
    const zTop = k / 3, eps = 1e-6;
    const atoms = [], index = new Map(), candO = [];
    const inBox = f => f[0] > -eps && f[0] < n + eps && f[1] > -eps && f[1] < n + eps && f[2] > -eps && f[2] < zTop + eps;
    const addAtom = (b, f) => {
      const key = b.el + f.map(v => Math.round(v * 1e5)).join(',');
      if (index.has(key)) return;
      const at = { id: atoms.length, el: b.el, site: b.site, f, p: cart(f), v: null };
      atoms.push(at); index.set(key, at);
    };
    for (let i = -1; i <= n; i++) for (let j = -1; j <= n; j++) for (let l = -1; l <= Math.ceil(zTop); l++)
      for (const t of CENTRING) for (const b of BASIS) {
        const f = [i + t[0] + b.f[0], j + t[1] + b.f[1], l + t[2] + b.f[2]];
        if (b.el === 'O') candO.push([b, f]);
        else if (inBox(f)) addAtom(b, f);
      }
    const crs = atoms.filter(a => a.el === 'Cr');
    for (const [b, f] of candO) {
      const p = cart(f);
      if (crs.some(c => Math.abs(c.p[2] - p[2]) < 1.5 && len(sub(p, c.p)) < DIST.CrO + 0.1)) addAtom(b, f);
    }

    const bonds = [], nb = new Map(atoms.map(a => [a, []]));
    for (let i = 0; i < atoms.length; i++) for (let j = i + 1; j < atoms.length; j++) {
      let A = atoms[i], B = atoms[j];
      const dz = Math.abs(A.p[2] - B.p[2]);
      if (dz > 2.4) continue;
      const d = len(sub(A.p, B.p)), pair = [A.el, B.el].sort().join('');
      let type = null;
      if (pair === 'OPd' && d < DIST.PdO + 0.15) type = 'Pd-O';
      else if (pair === 'CrO' && d < DIST.CrO + 0.15) type = 'Cr-O';
      else if (pair === 'PdPd' && dz < 0.01 && Math.abs(d - DIST.MM) < 0.05) type = 'Pd-Pd';
      if (!type) continue;
      if (A.el === 'O') [A, B] = [B, A];                  // cation first
      const bond = { type, A, B, d };
      bonds.push(bond); nb.get(A).push(bond); nb.get(B).push(bond);
    }

    const octa = [];
    for (const c of crs) {
      const os = nb.get(c).filter(b => b.type === 'Cr-O').map(b => b.B);
      if (os.length !== 6) continue;
      const pairs = [], used = new Set();
      for (const o of os) {
        if (used.has(o)) continue;

    pointers.delete(e.pointerId);
    if (e.type === 'pointerup' && gesture && gesture.moved < 4) {      // a tap / click: inspect the atom under it
      const [x, y] = local(e), at = atomAt(x, y);
      if (at) showTip(at, x, y); else hideTip();
    }
    if (pointers.size === 0) { gesture = null; canvas.classList.remove('dragging', 'panning'); }
    else if (pointers.size === 1) gesture = { mode: 'rotate', moved: 99 };
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && !pointers.size) hideTip(); });
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('dblclick', () => goView('reset'));
  canvas.addEventListener('wheel', e => {
    e.preventDefault(); stopAnim();
    const dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaMode === 2 ? e.deltaY * 400 : e.deltaY;
    const [x, y] = local(e);
    zoomAt(x, y, Math.exp(-dy * (e.ctrlKey ? 0.01 : 0.0015)));
  }, { passive: false });
  canvas.addEventListener('keydown', e => {
    const step = (e.shiftKey ? 15 : 5) * D2R, W = stage.clientWidth, H = stage.clientHeight;
    switch (e.key) {
      case 'ArrowLeft': S.phi -= step; break;
      case 'ArrowRight': S.phi += step; break;
      case 'ArrowUp': S.theta = clamp(S.theta - step, -Math.PI / 2, Math.PI / 2); break;
      case 'ArrowDown': S.theta = clamp(S.theta + step, -Math.PI / 2, Math.PI / 2); break;
      case '+': case '=': zoomAt(W / 2, H / 2, 1.15); break;
      case '-': case '_': zoomAt(W / 2, H / 2, 1 / 1.15); break;
      case '0': case 'r': case 'R': goView('reset'); break;
      default: return;
    }
    e.preventDefault(); stopAnim(); request();
  });

  /* ---- atom inspector ---- */
  const tip = $('#tip');
  function atomAt(x, y) {
    for (let i = hits.length - 1; i >= 0; i--) { const h = hits[i]; if ((x - h.x) ** 2 + (y - h.y) ** 2 <= h.r * h.r) return h.at; }
    return null;
  }
  function hoverAt(x, y) { const at = atomAt(x, y); if (at) showTip(at, x, y); else hideTip(); }
  const fracTxt = v => {
    v = ((v % 1) + 1) % 1; if (v > 1 - 1e-6) v = 0;
    const k = Math.round(v * 6);
    return Math.abs(v * 6 - k) < 1e-6 ? ['0', '1/6', '1/3', '1/2', '2/3', '5/6'][k % 6] : v.toFixed(4);
  };
  function tipHTML(at) {
    const f2 = d => d.toFixed(3);
    const env = {
      Pd: `2 × Pd–O ${f2(DIST.PdO)} Å (linear O–Pd–O)<br>6 × Pd–Pd ${f2(DIST.MM)} Å`,
      Cr: `6 × Cr–O ${f2(DIST.CrO)} Å<br>∠O–Cr–O ${ANG.intra.toFixed(1)}°, ${ANG.inter.toFixed(1)}°`,
      O:  `1 × O–Pd ${f2(DIST.PdO)} Å<br>3 × O–Cr ${f2(DIST.CrO)} Å`,
    }[at.el];
    return `<div class="tip-h">${ballSVG(at.el, 17)}${at.el}<span>${EL[at.el].name}, ${at.site.replace(/([a-z])$/, '<i>$1</i>')}</span></div>` +
           `<div class="tip-f">(${at.f.map(fracTxt).join(', ')})</div><div class="tip-n">${env}</div>`;
  }
  function showTip(at, x, y) {
    if (at !== hoverAtom) { hoverAtom = at; tip.innerHTML = tipHTML(at); request(); }
    tip.classList.add('on');
    const W = stage.clientWidth, H = stage.clientHeight, tw = tip.offsetWidth, th = tip.offsetHeight;
    let tx = x + 16, ty = y + 16;
    if (tx + tw > W - 8) tx = x - tw - 16;
    if (ty + th > H - 8) ty = y - th - 16;
    tip.style.transform = `translate(${Math.round(Math.max(8, tx))}px, ${Math.round(Math.max(8, ty))}px)`;
  }
  function hideTip() { if (hoverAtom) { hoverAtom = null; request(); } tip.classList.remove('on'); }

  /* ==================================================================
     SVG pieces (UI icons + export), same gradients as the reference figures
     ================================================================== */
  function sphereDefs(pre) {
    let s = '';
    for (const [el, E] of Object.entries(EL)) {
      s += `<radialGradient id="${pre}sphere_${el}" cx="0.5" cy="0.5" r="0.5" fx="0.35" fy="0.3" gradientUnits="objectBoundingBox">` +
           E.stops.map((c, i) => `<stop offset="${STOP_AT[i]}" stop-color="${c}"/>`).join('') + '</radialGradient>' +
           `<radialGradient id="${pre}rim_${el}" cx="0.5" cy="0.5" r="0.5" fx="0.75" fy="0.8" gradientUnits="objectBoundingBox">` +
           `<stop offset="0.7" stop-color="${E.rim}" stop-opacity="0"/><stop offset="1" stop-color="${E.rim}" stop-opacity="0.55"/></radialGradient>`;
    }
    for (const [id, st] of [['gloss', GLOSS], ['spark', SPARK]])
      s += `<radialGradient id="${pre}${id}" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox">` +
           st.map(([o, a]) => `<stop offset="${o}" stop-color="#ffffff" stop-opacity="${a}"/>`).join('') + '</radialGradient>';
    return s;
  }
  const nf = v => +v.toFixed(2);
  function atomSVG(x, y, r, el, pre, fog, label) {
    const gx = nf(x - 0.3 * r), gy = nf(y - 0.4 * r), kx = nf(x - 0.38 * r), ky = nf(y - 0.48 * r);
    const c = `cx="${nf(x)}" cy="${nf(y)}" r="${nf(r)}"`;
    return (label ? `<g inkscape:label="${label}">` : '<g>') +
      `<circle ${c} fill="url(#${pre}sphere_${el})"/><circle ${c} fill="url(#${pre}rim_${el})"/>` +
      `<ellipse cx="${gx}" cy="${gy}" rx="${nf(0.5 * r)}" ry="${nf(0.32 * r)}" fill="url(#${pre}gloss)" transform="rotate(-35 ${gx} ${gy})"/>` +
      `<ellipse cx="${kx}" cy="${ky}" rx="${nf(0.17 * r)}" ry="${nf(0.11 * r)}" fill="url(#${pre}spark)" transform="rotate(-35 ${kx} ${ky})"/>` +
      (fog > 0.002 ? `<circle ${c} fill="#ffffff" fill-opacity="${fog.toFixed(3)}"/>` : '') + '</g>';
  }
  function ballSVG(el, size) {
    const c = size / 2;
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">${atomSVG(c, c, c - 1, el, 'ui-', 0)}</svg>`;
  }
  function bondSVG(e1, e2) {
    return `<svg width="26" height="14" viewBox="0 0 26 14" aria-hidden="true"><rect x="5" y="5.9" width="16" height="2.2" rx="1" fill="#a3a3a3"/>` +
           atomSVG(5.5, 7, 4.6, e1, 'ui-', 0) + atomSVG(20.5, 7, e2 === 'O' ? 3.8 : 4.6, e2, 'ui-', 0) + '</svg>';
  }

  function exportSVG() {
    const W = Math.round(stage.clientWidth), H = Math.round(stage.clientHeight);
    const { prims, R } = buildScene(W, H);
    const grads = [], body = [];
    let gid = 0;
    const emit = p => {
      if (p.kind === 'atom') {
        const lab = `${p.at.el} ${p.at.site} (${p.at.f.map(fracTxt).join(', ')})`;
        body.push(atomSVG(p.x, p.y, p.r, p.at.el, '', p.fog, lab));
      } else if (p.kind === 'bond') {
        const q = bondNormal(p); if (!q) return;
        const id = 'bond' + gid++, h = p.w / 2, mx = (p.x1 + p.x2) / 2, my = (p.y1 + p.y2) / 2, e = 0.4;
        grads.push(`<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="${nf(mx + q.nx * h)}" y1="${nf(my + q.ny * h)}" x2="${nf(mx - q.nx * h)}" y2="${nf(my - q.ny * h)}">` +
                   BOND_STOPS.map(([o, c]) => `<stop offset="${o}" stop-color="${hex(toWhite(c, p.fog))}"/>`).join('') + '</linearGradient>');
        body.push(`<line x1="${nf(p.x1 - q.dx * e)}" y1="${nf(p.y1 - q.dy * e)}" x2="${nf(p.x2 + q.dx * e)}" y2="${nf(p.y2 + q.dy * e)}" stroke="url(#${id})" stroke-width="${nf(p.w)}"/>`);
      } else if (p.kind === 'seg') {
        body.push(`<line x1="${nf(p.x1)}" y1="${nf(p.y1)}" x2="${nf(p.x2)}" y2="${nf(p.y2)}" stroke="${hex(toWhite(CELL_RGB, Math.min(0.85, p.fog * 1.3)))}" stroke-width="1.1"/>`);
      } else if (p.kind === 'face') {
        body.push(`<polygon points="${p.pts.map(([x, y]) => nf(x) + ',' + nf(y)).join(' ')}" fill="${hex(toWhite(OCTA_FILL, p.fog))}" fill-opacity="${OCTA_FA}" ` +
                  `stroke="${hex(toWhite(OCTA_EDGE, p.fog))}" stroke-opacity="${OCTA_EA}" stroke-width="0.9" stroke-linejoin="round"/>`);
      } else if (p.kind === 'group') {
        body.push('<g inkscape:label="CrO6 octahedron">'); p.back.forEach(emit); p.items.forEach(emit); p.front.forEach(emit); body.push('</g>');
      }
    };
    prims.forEach(emit);
    const ax = axesItems(H, R).map(it => {
      if (it.t === 'line') return `<line x1="${nf(it.x1)}" y1="${nf(it.y1)}" x2="${nf(it.x2)}" y2="${nf(it.y2)}" stroke="${it.col}" stroke-width="1.3" stroke-linecap="round"/>`;
      if (it.t === 'head') return `<polygon points="${it.pts.map(([x, y]) => nf(x) + ',' + nf(y)).join(' ')}" fill="${it.col}"/>`;
      if (it.t === 'text') return `<text x="${nf(it.x)}" y="${nf(it.y)}" fill="${it.col}" font-family="CMU Serif, Latin Modern Roman, Times New Roman, serif" font-style="italic" font-size="16" text-anchor="middle" dominant-baseline="central">${it.s}</text>`;
      if (it.t === 'origin') return `<circle cx="${nf(it.x)}" cy="${nf(it.y)}" r="1.7" fill="${it.col}"/>`;
      return `<circle cx="${nf(it.x)}" cy="${nf(it.y)}" r="5" fill="none" stroke="${it.col}" stroke-width="1.3"/>` + (it.toward
        ? `<circle cx="${nf(it.x)}" cy="${nf(it.y)}" r="1.6" fill="${it.col}"/>`
        : `<path d="M${nf(it.x - 3.2)},${nf(it.y - 3.2)}L${nf(it.x + 3.2)},${nf(it.y + 3.2)}M${nf(it.x + 3.2)},${nf(it.y - 3.2)}L${nf(it.x - 3.2)},${nf(it.y + 3.2)}" stroke="${it.col}" stroke-width="1.3"/>`);
    });
    const svg = `<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
<defs>${sphereDefs('')}
${grads.join('\n')}</defs>
<rect id="background" inkscape:label="background" width="${W}" height="${H}" fill="#ffffff"/>
<g id="structure" inkscape:label="PdCrO2 structure" inkscape:groupmode="layer">
${body.join('\n')}
</g>
<g id="axes" inkscape:label="axes" inkscape:groupmode="layer">${ax.join('')}</g>
</svg>`;
    download('PdCrO2_structure.svg', new Blob([svg], { type: 'image/svg+xml' }));
  }
  function exportPNG() {
    const W = stage.clientWidth, H = stage.clientHeight, ratio = 3;
    const cv = document.createElement('canvas'); cv.width = Math.round(W * ratio); cv.height = Math.round(H * ratio);
    const g = cv.getContext('2d'); g.setTransform(ratio, 0, 0, ratio, 0, 0);
    g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
    const { prims, R } = buildScene(W, H);
    for (const p of prims) drawPrim(g, p, ratio, null);
    drawAxes(g, H, R);
    cv.toBlob(b => download('PdCrO2_structure.png', b), 'image/png');
  }
  function download(name, blob) {
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  /* ==================================================================
     Panel wiring
     ================================================================== */
  $('#uiDefs').innerHTML = sphereDefs('ui-');

  for (const b of document.querySelectorAll('[data-el]')) {
    b.insertAdjacentHTML('afterbegin', ballSVG(b.dataset.el, 20));
    b.addEventListener('click', () => {
      const el = b.dataset.el; S.show[el] = !S.show[el];
      b.setAttribute('aria-pressed', String(S.show[el])); request();
    });
  }
  for (const b of document.querySelectorAll('[data-bond]')) {
    const [e1, e2] = b.dataset.bond.split('-');
    b.insertAdjacentHTML('afterbegin', bondSVG(e1, e2));
    b.addEventListener('click', () => {
      const t = b.dataset.bond; S.bondType[t] = !S.bondType[t];
      b.setAttribute('aria-pressed', String(S.bondType[t])); request();
    });
  }
  $('#bonds').addEventListener('change', e => { S.bonds = e.target.checked; $('#bondChips').classList.toggle('off', !S.bonds); request(); });
  for (const id of ['octa', 'cell', 'fog']) $('#' + id).addEventListener('change', e => { S[id] = e.target.checked; request(); });
  $('#size').addEventListener('input', e => { S.size = +e.target.value; $('#sizeOut').textContent = S.size.toFixed(2) + '×'; request(); });

  for (const st of document.querySelectorAll('.stepper')) {
    const key = st.dataset.key, min = +st.dataset.min, max = +st.dataset.max, out = st.querySelector('output');
    const [dec, inc] = st.querySelectorAll('button');
    const sync = () => { out.textContent = S[key]; dec.disabled = S[key] <= min; inc.disabled = S[key] >= max; };
    st.addEventListener('click', e => {
      const btn = e.target.closest('button'); if (!btn) return;
      const v = clamp(S[key] + +btn.dataset.d, min, max);
      if (v === S[key]) return;
      S[key] = v; sync();
      M = buildModel(S.n, S.k); hideTip();
      applyView(fitFor(S.phi, S.theta));
    });
    sync();
  }
  for (const b of document.querySelectorAll('[data-view]')) b.addEventListener('click', () => goView(b.dataset.view));
  $('#exSvg').addEventListener('click', exportSVG);
  $('#exPng').addEventListener('click', exportPNG);

  const NB = ' ', bl = (name, d) => `<span style="white-space:nowrap">${name} ${d.toFixed(3)} Å</span>`;
  $('#meta').innerHTML =
    `<p><i>a</i>${NB}=${NB}${LAT.a.toFixed(4)}${NB}Å, <i>c</i>${NB}=${NB}${LAT.c.toFixed(3)}${NB}Å, <i>z</i><sub>O</sub>${NB}=${NB}${LAT.z.toFixed(4)}<br>` +
    `Pd${NB}3<i>a</i>${NB}(0,0,0) · Cr${NB}3<i>b</i>${NB}(0,0,1/2) · O${NB}6<i>c</i>${NB}(0,0,<i>z</i>)<br>` +
    `${bl('Pd–O', DIST.PdO)} · ${bl('Cr–O', DIST.CrO)} · ${bl('Pd–Pd', DIST.MM)}</p>` +
    `<p>Paramagnetic phase (<i>T</i>${NB}&gt;${NB}<i>T</i><sub>N</sub>${NB}≈${NB}37.5${NB}K), so no ordered Cr moments are drawn. ` +
    `Structure: Takatsu <i>et al.</i>, PRB <b>89</b>, 104408 (2014), X-ray, 300${NB}K.</p>`;

  /* ==================================================================
     Sizing
     ================================================================== */
  function resize() {
    const W = stage.clientWidth, H = stage.clientHeight;
    if (!W || !H) return;
    dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    const mn = Math.min(W, H);
    if (!ready) { ready = true; applyView(fitFor(S.phi, S.theta)); }
    else if (lastMin) S.scale *= mn / lastMin;
    lastMin = mn;
    draw();
  }
  new ResizeObserver(resize).observe(stage);
  if (document.fonts) {
    document.fonts.load(`italic 16px "CM Serif"`).then(request, () => {});
    document.fonts.ready.then(request);
  }
})();
</script>
</body>
</html>
